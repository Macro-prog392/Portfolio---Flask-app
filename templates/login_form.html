<!DOCTYPE html>
<html>

<head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"

    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Verdana,calibri, Tahoma, sans-serif;
        }

        body {
            background: white;
            padding: 0.5px
        }

        h1 {
            color: white;
            line-height: 2.5;
            font-family: cambria;
            text-transform: uppercase;
        
            font-size: 1.2em;
            letter-spacing: 1.2px;
        }

        p {
            display: grid;
            place-items: center;
            gap: 14px;
            font-size: 0.9em;
            font-weight: 470;
            text-transform: capitalize;
            margin-top: 10px;
        }

        a {
            color:yellow;
            padding: 6px 12px;
            max-width: 100%;
            text-underline-offset: 7px;
            border-radius: 0.5px;
            text-shadow: 0px 1px 50px white;
            width: fit-content;
            letter-spacing: 1px;
            font-size: 0.73rem;
            font-family: copper black;
        text-decoration-thickness: 7px;
            font-weight: 700;
            border-top: 1.9px groove aliceblue;
        }
        a:hover {
            text-decoration-color: yellow;
        }
        header{
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 9px 14px;
            background-image: linear-gradient(65deg, aqua,purple);
        }
        
    form{
        display: grid;
        backgrund-color: rgb(7, 102, 180);
        border: 2px solid white;
        background-color: aliceblue;
        padding: 30px 7px;
        row-gap: 15px;
        scale: 0.9;
    box-sadow: 0px 1px 8px rgb(6, 20, 13);
        place-items: center;
        border-radius: 10px;
    }
    form button{
        display: block;
        background: green;
    }
    input{
        padding: 12px;
        border: none;
        transition-duration: 1s;
        outline: none;
        display: block;
        min-width: 80%;
        box-shaow: 1px 1px 9px green;
        border-radius: 15px;
        margin-bottom: 12px;
        border-bottom: 2.3px solid black;
        background: rgba(102, 51, 153, 0.873);
        
    }
    input::placeholder{
        font-weight: 500;
        color: aliceblue;
        text-transform: capitalize;
        line-height: 1.7;
    }
    input[type="submit"] {
        min-width: 100%;
        background: rgb(7, 221, 7);
        text-transform: uppercase;
        font-weight: bold;
        padding: 6px 10px;
        font-family: arial;
        border-radius: 4px;
        color: aliceblue;
    }
    input:hover{
        background: grey;
        border: none;
        color: lawngreen
    }
    input:hover::placeholder {
        color: green;
    }
    .badge{
        color: forestgreen;
        width: fit-content;
        display: grid;
        font-weight: bold;
        font-family: cambria;
        place-items: center;
        border-radius: 7px;
        margin-left: 60px;
        margn: 0 auto;
        padding: 12px
    }
    #box{
        display: flex;
    }
    #box > figure{
        flex-grow: 2;
        border: 0px solid red
    }
    #box > div{
        flex-grow: 2;
    }
    #box img{
        max-height: 80vh;
        box-shaow: 7px 2px 10px blue;
        border-top-right-radius: 20%;
        border-bottom-left-radius: 10%;
        display: block;
        padding:10px;
        scale:0.93;
        filter: drop-shadow(0px 0px 19px midnightblue);
        backgound: rgba(7, 228, 37, 0.726);
        background: rgba(3, 166, 241, 0.178);
        object-fit: contain;
        min-width: 90%;
        border: 0px solid rebeccapurple;
        margin-bottom: 12px;
    }
    #box figcaption{
        padding : 10px 7px;
        font-weight: bold;
        text-align: center;
        font-size: 1em;
        font-family: cambria;
        text-transform: capitalize;
        color: rebeccapurple;
        background: whitesmoke;
    }
    .badge span{
        background: blue;
        color: yellow;
        border-radius: 6px;
        padding: 10px 30px
    }
    #box article{
        display: flex;
    }
    article p{
        flex-grow: 1;
    }
    article a{
        color: green
    }
    footer {
    padding: 12px 5px;
background: navajowhite;}

</head>
