/* =========================================================
   MR. MACRO — PROFESSIONAL PORTFOLIO THEME
   CSS rewritten without changing the HTML structure.
   Brand: hwb(147 20% 10%) + rebeccapurple
   ========================================================= */

:root {
  --green: hwb(147 20% 10%);
  --green-dark: hwb(147 34% 22%);
  --green-soft: hwb(147 72% 4%);
  --purple: rebeccapurple;
  --purple-dark: #4b267a;
  --purple-soft: #eee7f8;
  --ink: #17131d;
  --muted: #655e6d;
  --white: #ffffff;
  --surface: #fbfaff;
  --surface-2: #f3eff8;
  --line: rgba(102, 65, 135, .16);
  --shadow-sm: 0 8px 24px rgba(46, 27, 62, .08);
  --shadow-md: 0 18px 45px rgba(46, 27, 62, .13);
  --shadow-lg: 0 28px 70px rgba(46, 27, 62, .17);
  --radius: 18px;
  --radius-sm: 12px;
  --max: 1180px;
  --ease: cubic-bezier(.2,.8,.2,1);
}

html {
  scroll-behavior: smooth;
  background: var(--surface);
      font-family: cambria,serif;
}

*, *::before, *::after {
  box-sizing: border-box;

}

body {

  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 5%, rgba(102, 51, 153, .12), transparent 28rem),
    radial-gradient(circle at 92% 16%, rgba(20, 214, 125, .13), transparent 28rem),
    linear-gradient(180deg, #ffffff 0%, var(--surface) 52%, #f7f4fa 100%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", cambria, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  overflow-x: hidden;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

a {
  color: var(--purple);
  text-decoration: none;
  transition: color .25s var(--ease), background-color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
}

a:hover {
  color: var(--green-dark);
}

a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(102, 51, 153, .28);
  outline-offset: 3px;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* ---------------- Header ---------------- */
.header.container-fluid {
  position: sticky;
  top: 12px;
  z-index: 1000;
  width: min(calc(100% - 28px), var(--max));
  margin: 12px auto 0;
  padding: 12px 16px;
  display: flex !important;
  align-items: center;
  gap: 24px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 20px;
  background: rgba(255,255,255,.82) !important;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: headerDrop .7s var(--ease) both;
}

.header > aside:first-child h2 {
  margin: 0 !important;
  color: var(--purple) !important;
  font-size: clamp(1.05rem, 2vw, 1.35rem) !important;
  letter-spacing: -.03em;
  white-space: nowrap;
}

.header > aside:first-child h2 span {
  color: var(--green) !important;
}

.header > div {
  flex: 1 1 auto;
  min-width: 0;
}

.header nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}

.header .head {
  display: flex !important;
  align-items: center;
  justify-content: flex-end !important;
  gap: 7px !important;
  padding: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.header .head a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  border: 1px solid transparent;
  border-radius: 10px;
  color: var(--ink);
  font-weight: 700;
  font-size: .88rem;
  text-transform: capitalize;
}

.header .head a:hover {
  color: var(--purple);
  background: var(--purple-soft);
  border-color: var(--line);
  transform: translateY(-2px);
}

.header .head i {
  color: var(--green) !important;
}

.header nav figure {
  position: relative;
  margin: 0 !important;
}

.header nav figure > img {
  width: 48px !important;
  height: 48px !important;
  object-fit: cover;
  border: 2px solid var(--green);
  border-radius: 50%;
  box-shadow: 0 0 0 4px var(--green-soft), var(--shadow-sm);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}

.header nav figure > img:hover {
  transform: rotate(-4deg) scale(1.06);
  box-shadow: 0 0 0 5px var(--purple-soft), var(--shadow-md);
}

.header nav figcaption p {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  min-width: 130px;
  padding: 6px !important;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,.96);
  box-shadow: var(--shadow-md);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s;
}

.header nav figure:hover figcaption p,
.header nav figure:focus-within figcaption p {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.header nav figcaption p a {
  display: block;
  padding: 8px 10px;
  border-radius: 8px;
}

.header nav figcaption p a:hover {
  background: var(--purple-soft) !important;
  color: var(--purple) !important;
}

/* ---------------- Global sections ---------------- */
main {
  width: 100%;
  animation: fadeUp .8s .08s var(--ease) both;
}

main > section , #Footer   {
  width: min(calc(100% - 28px), var(--max));
  margin-inline: auto;
}

main > section {
  margin-top: 38px;
  margin-bottom: 38px;
}

section > h1,
section > h2,
section > h3 {
  color: var(--purple);
  text-align: center;
  letter-spacing: -.04em;
}

/* ---------------- Hero ---------------- */
#hero {
  position: relative;
  min-height: 560px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  place-iems: center;
  padding: clamp(24px, 5vw, 60px);
  border: 1px solid var(--line);
  border-radius: 28px;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(255,255,255,.94), rgba(245,240,250,.9)),
    radial-gradient(circle at 85% 15%, rgba(20,214,125,.22), transparent 24rem);
  box-shadow: var(--shadow-md);
}

#hero::before,
#hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(2px);
}

#hero::before {
  width: 260px;
  height: 260px;
  left: -90px;
  bottom: -110px;
  background: rgba(102,51,153,.12);
}

#hero::after {
  width: 190px;
  height: 190px;
  right: -70px;
  top: -70px;
  background: rgba(20,214,125,.13);
}

#hero-main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 450px;
  dispay: grid;
  
  grid-temlate-columns: minmax(0, 1fr) minmax(200px, 490px);
  
  gap: clamp(28px, 6vw, 70px);
}

#hero-main > article:first-child > aside p {
  margin: 0 0 14px !important;
  color: var(--purple) !important;

  font-weight: 900 !important;

}


#hero-main > article:first-child ul,
#hero-card {
  margin: 0 auto;

}

#hero-main > article:first-child li,
#hero-card li {

  gap: 9px;

}

#hero-main > article:first-child li::before,
#hero-card li::before {
  content: "✓";

  left: -35px;
  top: .05em;
  display: grid;
  place-items: center;
  width: 19px;
  height: 19px;
  border-radius: 50%;

}

#hero-main > article:nth-child(2) {
  max-width: none !important;

  padding: clamp(24px, 4vw, 34px) !important;

  border-bottom: 3px solid var(--green) !important;
  border-radius: var(--radius) !important;

  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}

#hero-main > article:nth-child(2):hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

#hero-main > article:nth-child(2) h2 {
  margin: 0 0 20px !important;

  font-size: clamp(1.35rem, 3vw, 2rem) !important;

}

#hero-main > article:nth-child(2) dl {
  display: block !important;

}

  color: var(--green-dark) !important;
  font-weight: 800;
}

#hero-main button,
#hero-main > article button {
  min-width: 160px !important;
  margin: 24px auto 0 !important;
  padding: 12px 20px;
  border: 1px solid transparent !important;
  border-radius: 10px;
  color: var(--white) !important;
  background: var(--purple) !important;
  box-shadow: 0 10px 24px rgba(102,51,153,.22) !important;
  font-weight: 800;
  transition: transform .25s var(--ease), background-color .25s var(--ease), box-shadow .25s var(--ease);
}

#hero-main button:hover,
#hero-main > article button:hover {
  background: var(--green) !important;
  transform: translateY(-3px);
  box-shadow: 0 14px 28px rgba(20,180,105,.25) !important;
}

#hero-main button:active {
  transform: translateY(-1px) scale(.98);
}
#hero-aside img {
  width: 200px;
  margin: 0 auto;
  height: clamp(400px, 10rem, 60vh)
}


/* ---------------- Services ---------------- */
      #service > div {
        display : flex;

 color:  hwb(147 24% 10%);

/* ---------------- About ---------------- */

#contactform textarea {
  min-height: 30px;
  max-height: 140px;
  min-width: 140px;
  background: rgba(255, 255, 255, 0.418); 
  border-radius: 4px;
  resize: vertical;
  color: white
}
textarea::placeholder {
  color: white
}

#footerLink {
  padding-top: 28px;
}

#footerLink h5 {
  margin: 0 0 16px;
  color: var(--white);
  text-align: center;
  font-size: 1.4rem;
  font-weight: bold;
  text-transform: capitalize;
}

#footerLink > div {
  display: flex ;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center !important;
}

#footerLink p {
  padding: 7px 10px;
  border-radius: 8px;
 
  background-imae: linear-gradient(78deg,lavender,white);
  color: rebecapurpl;
  font-weight: bold;
  transition: background-color .25s var(--ease), transform .25s var(--ease);
}

#footerLink p:hover {
  background: rgba(255,255,255,.1);
  border: 1px solid white;
  transform: translateY(-2px);
}

#footerLink p a, #otherLink a {
 
  color: white;
  font-size: .7rem;
  text-transform: capitalize
}

#footerLink p a:hover {
  color: var(--white);
}#footerLink p:hover i {
  color: var(--white);
  background: none;
}

#footerLink i {
  margin-right: 5px;
  background: whitesmoke;
  padding: 6.7px;
  border: 1.8px dashed lavender;
  font-size: 0.8em;
  font-weight: bolder;
  filter: drop-shadow(0px 0px 12px  black);
  border-radius: 6.7px;
  width: fit-content
}

#footer > section:last-child p:last-child,
#footer p.fs-3 {
  margin-top: 30px !important;
  padding: 12px !important;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 10px !important;
  color: rgba(255,255,255,.85) !important;
  background: rgba(255,255,255,.08) !important;
  text-align: center !important;
  font-size: .78rem !important;
  font-weight: 700 !important;
}
#otherLink {
  display: grid;
  flex-direction: column;
 
  padding-left: 40px;

place-items: flex-start;
  gap: 15px
}
#otherLink a{
  background-color: var(--purple-dark);
  border-radius: 4px;
  padding: 6px 15px;
  font-size: 0.8rem;
  border: 1.7px dashed aliceblue;
  color: aliceblue;
}

/* ---------------- Utility animation ---------------- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes headerDrop {
  from { opacity: 0; transform: translateY(-18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------------- Responsive ---------------- */
@media (max-width: 900px) {
  #hero-main {
    grid-template-columns: 1fr;
  }

  #hero-main > article:first-child {
    text-align: center;
  }

  #hero-main > article:first-child li {
    width: fit-content;
    margin-inline: auto;
    text-align: left;
  }

  .project {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {
  .header.container-fluid {
    top: 7px;
    width: calc(100% - 16px);
    margin-top: 7px;
    padding: 10px 12px;
    gap: 10px;
  }

  .header .head a {
    padding: 7px;
    font-size: .78rem;
  }

  .header .head a i {
    display: none;
  }

  .header nav figure > img {
    width: 42px !important;
    height: 42px !important;
  }

  main > section, #Footer {
    width: min(calc(100% - 16px), var(--max));
  }
  

  #hero {
    min-height: auto;
    padding: 28px 18px;
  }

  .skill {
    grid-template-columns: 1fr;
  }

  #contactform > div:first-child {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  body {
    font-size: 15px;
  }

  .header > aside:first-child h2 {
    font-size: .95rem !important;
  }

  .header .head {
    gap: 2px !important;
  }

  .header .head a {
    padding: 6px 5px;
  }

  #hero-main > article:nth-child(2) {
    padding: 20px !important;
  }

  .project {
    padding: 12px;
  }

  .project_img {
    grid-template-columns: 1fr;
  }

  .project_img img {
    min-height: 120px;
    max-height: 170px;
  }

  #footer {
    padding: 24px 18px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
